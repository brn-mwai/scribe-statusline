<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCRIBE demo terminal</title>
<style>
  :root {
    --bg: #0d0d0f;
    --chrome: #17171a;
    --text: #d7d7db;
    --dim: #6f6f77;
    --orange: #d97757;
    --green: #26bf7f;
    --amber: #ffaf3f;
    --red: #ff4d4d;
    --blue: #4cb3ff;
    --violet: #b78cf5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #08080a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  #term {
    width: 940px;
    height: 512px;
    background: var(--bg);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 60px rgba(0,0,0,.6);
  }
  .titlebar {
    height: 32px;
    background: var(--chrome);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    flex: none;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .title { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .body {
    flex: 1;
    padding: 14px 18px 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .line { font-size: 14px; line-height: 1.62; color: var(--text); white-space: pre-wrap; }
  .dim { color: var(--dim); }
  .orange { color: var(--orange); }
  .green { color: var(--green); }
  .amber { color: var(--amber); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .violet { color: var(--violet); }
  .bold { font-weight: 700; }
  .box {
    margin: 10px 18px 6px;
    border: 1px solid #2b2b31;
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 14px;
    flex: none;
  }
  .box .caret { color: var(--dim); margin-right: 8px; }
  .cursor { background: var(--text); color: var(--bg); }
  .status {
    padding: 4px 20px 12px;
    font-size: 13px;
    color: var(--dim);
    flex: none;
    letter-spacing: .1px;
  }
  .sep { color: #3a3a42; }
  .alert {
    border-left: 2px solid var(--red);
    padding-left: 10px;
    margin: 6px 0 2px;
  }
</style>
</head>
<body>
<div id="term">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">claude — scribe demo</span>
  </div>
  <div class="body" id="body"></div>
  <div class="box"><span class="caret">&gt;</span><span id="input"></span></div>
  <div class="status" id="status"></div>
</div>

<script>
const SCENE = [
  { at: 0,    pct: 12,  kind: "line", html: '<span class="orange">⏺</span> Read <span class="dim">src/auth/middleware.ts</span>' },
  { at: 700,  pct: 18,  kind: "line", html: '<span class="dim">  ⎿  Read 212 lines</span>' },
  { at: 1400, pct: 34,  kind: "type", target: "input", text: "keep going, and check the token refresh path" },
  { at: 4200, pct: 47,  kind: "clear-input" },
  { at: 4400, pct: 58,  kind: "line", html: '<span class="orange">⏺</span> Edit <span class="dim">src/auth/refresh.ts</span>' },
  { at: 5100, pct: 68,  kind: "line", html: '<span class="dim">  ⎿  Updated with 3 additions and 1 removal</span>' },
  { at: 5800, pct: 79,  kind: "line", html: '<span class="orange">⏺</span> Grep <span class="dim">"expiresAt" (14 files)</span>' },
  { at: 6600, pct: 86,  kind: "line", html: '<span class="orange">⏺</span> Read <span class="dim">src/auth/session.ts</span>' },
  { at: 7400, pct: 92,  kind: "line", html: '<span class="blue bold">SCRIBE</span> <span class="red bold">context 92% — DUMB threshold reached</span>' },
  { at: 8100, pct: 92,  kind: "line", html: '<span class="dim">  ⎿  wrote</span> <span class="violet">_handoff/CURRENT.md</span>' },
  { at: 8700, pct: 92,  kind: "line", html: '<span class="dim">  ⎿  wrote</span> <span class="violet">_handoff/handoff-graph.json</span>' },
  { at: 9300, pct: 93,  kind: "line", html: '<span class="dim">  ⎿  wrote</span> <span class="violet">_handoff/CONTINUATION.md</span>' },
  { at: 10000, pct: 93, kind: "line", html: '<span class="orange">⏺</span> Session state captured. Start a fresh instance and paste:' },
  { at: 10700, pct: 93, kind: "line", html: '<span class="green">  Resume auth-refactor on brn-mwai/api@fix-token-refresh.</span>' },
  { at: 11200, pct: 93, kind: "line", html: '<span class="green">  Read _handoff/CURRENT.md IN FULL first, then continue at step 3.</span>' },
];

function rotState(p) {
  if (p >= 90) return ["DUMB", "red"];
  if (p >= 75) return ["FADING", "amber"];
  if (p >= 50) return ["OK", "green"];
  return ["SHARP", "green"];
}

function pctAt(t) {
  let prev = { at: 0, pct: 12 };
  for (const e of SCENE) {
    if (e.at <= t) prev = e;
    else {
      const span = e.at - prev.at || 1;
      const k = Math.min(1, Math.max(0, (t - prev.at) / span));
      return Math.round(prev.pct + (e.pct - prev.pct) * k);
    }
  }
  return prev.pct;
}

function renderStatus(t) {
  const pct = pctAt(t);
  const [state, cls] = rotState(pct);
  const used = Math.round(pct * 10);
  const sep = '<span class="sep"> | </span>';
  let s = '<span style="color:#f0f0f2;font-weight:700">Opus 5 (1M)</span>' + sep +
          '<span class="blue">[SCRIBE]</span> <span class="' + cls + '">' + state + ' ' + used + 'k/1M ' + pct + '%</span>';
  if (state === "DUMB" && Math.floor(t / 500) % 2 === 0) {
    s += ' <span class="red bold">! HANDOFF -&gt; NEW INSTANCE</span>';
  } else if (state === "DUMB") {
    s += ' <span class="red bold" style="opacity:.35">! HANDOFF -&gt; NEW INSTANCE</span>';
  }
  document.getElementById("status").innerHTML = s;
}

function renderAt(t) {
  const body = document.getElementById("body");
  const input = document.getElementById("input");
  const lines = [];
  let inputText = "";
  let typing = false;

  for (const e of SCENE) {
    if (e.at > t) continue;
    if (e.kind === "line") lines.push(e.html);
    if (e.kind === "type") {
      const chars = Math.min(e.text.length, Math.floor((t - e.at) / 55));
      inputText = e.text.slice(0, chars);
      typing = chars < e.text.length;
    }
    if (e.kind === "clear-input") { inputText = ""; typing = false; }
  }

  body.innerHTML = lines.slice(-14).map(h => '<div class="line">' + h + "</div>").join("");
  const blink = Math.floor(t / 450) % 2 === 0 || typing;
  input.innerHTML = inputText + (blink ? '<span class="cursor"> </span>' : " ");
  renderStatus(t);
}

window.renderAt = renderAt;
window.SCENE_MS = 12200;
renderAt(0);
</script>
</body>
</html>
